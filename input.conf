# =========================================================================
# MPV Keybindings Configuration
# Optimized for Videophile Playback, Studio Audio & High-Res Image Viewing
# =========================================================================

# ===== Scalers, Neural Filters & Enhancements =====

# 1: NVIDIA RTX Video Super Resolution (Hardware AI Tensor Core)
1          change-list glsl-shaders clr all ; script-message autovsr-toggle

# 2: NVIDIA Image Scaling (NIS Spatial Upscaler)
2          change-list glsl-shaders set "~~/scalers/NVScaler.glsl" ; vf remove @vsr ; show-text "Upscaler: NVIDIA NIS"

# 3: AMD FidelityFX Super Resolution (FSR 1.0: EASU + RCAS)
3          change-list glsl-shaders set "~~/scalers/FSR.glsl" ; vf remove @vsr ; show-text "Upscaler: AMD FSR 1.0 (EASU + RCAS)"

# 4: Qualcomm Snapdragon Game Super Resolution (Single-Pass Edge Scaler)
4          change-list glsl-shaders set "~~/scalers/SGSR.glsl" ; vf remove @vsr ; show-text "Upscaler: Qualcomm SGSR"

# 5: AMD Contrast Adaptive Sharpening (Scaled Reconstruction)
5          change-list glsl-shaders set "~~/scalers/CAS-scaled.glsl" ; vf remove @vsr ; show-text "Upscaler: AMD CAS (Scaled)"

# Reserved Number Keys
6          ignore
7          ignore
8          ignore

# NVIDIA RTX Video True HDR (SDR -> HDR auto-protection)
h          script-message autohdr-toggle

# ===== Diagnostics, Pacing & Master Reset =====

# 9: Cycle base luma scaler fallback
9          cycle-values scale "nearest" "lanczos" ; show-text "Base Luma Scaler: ${scale}"

# 0: Master Reset (Shaders, VSR, True HDR, Scalers, Pacing, Zoom and Pan)
0          change-list glsl-shaders clr all ; vf remove @vsr ; vf remove @truehdr ; set scale "lanczos" ; set video-sync "display-resample" ; set interpolation "yes" ; set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; show-text "Reset: Default Scaling, Pacing & Geometry"

# -: OSD Status query
-          show-text "Active Shaders: ${glsl-shaders} | Sync: ${video-sync}"

# M (Shift+M): Toggle Frame Pacing on the fly (display-resample vs audio clock for G-Sync/VRR testing)
M          cycle-values video-sync "display-resample" "audio" ; cycle-values interpolation "yes" "no" ; show-text "Motion Sync: ${video-sync} | Interpolation: ${interpolation}"

# ===== Image Viewer & Video Geometry Controls =====

# Smooth Zooming (Snappy 0.10 step)
WHEEL_UP   add video-zoom 0.10
WHEEL_DOWN add video-zoom -0.10

# Reset Zoom & Center Pan (Middle Click or Backspace)
MBTN_MID   set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; show-text "Reset Zoom & Pan"
BS         set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; show-text "Reset Zoom & Pan"

# Viewport Panning (Move around images/zoomed videos)
Alt+LEFT   add video-pan-x  0.05
Alt+RIGHT  add video-pan-x -0.05
Alt+UP     add video-pan-y  0.05
Alt+DOWN   add video-pan-y -0.05

# Orientation & Rotation
r          cycle-values video-rotate 90 180 270 0 ; show-text "Rotate: ${video-rotate}°"
R          cycle-values video-rotate 270 180 90 0 ; show-text "Rotate: ${video-rotate}°"
Alt+v      cycle-values video-hflip yes no ; show-text "Horizontal Mirror: ${video-hflip}"

# ===== Playback, Navigation & Playlist =====

SPACE      cycle pause
MBTN_RIGHT cycle pause
q          quit
ESC        quit

# Precise Seeking (Video)
LEFT       seek -5 exact
RIGHT      seek  5 exact
Shift+LEFT seek -1 exact
Shift+RIGHT seek 1 exact
.          frame-step ; show-text "Frame Step Forward"
,          frame-back-step ; show-text "Frame Step Backward"

# Playlist & Image Browsing (Folder photo flipping)
PGUP       playlist-prev ; show-text "Previous: ${media-title}"
PGDWN      playlist-next ; show-text "Next: ${media-title}"
CTRL+LEFT  playlist-prev
CTRL+RIGHT playlist-next

# Playback Loops & Deband
l          cycle-values loop-file inf no ; show-text "Loop: ${loop-file}"
d          cycle deband ; show-text "Deband: ${deband}"

# ===== Audio, Headphone & Volume Controls =====

# Master Volume & Mute
UP         add volume 2
DOWN       add volume -2
m          cycle mute ; show-text "Mute: ${mute}"

# Toggle Audio Player Studio HUD on/off
a          script-message toggle-audio-hud

# A: Cycle Headphone DSP Presets (7.1 Spatial Upmix -> BS2B Crossfeed -> Stereo Widener -> Nightmode -> Direct)
A          script-message cycle-audio-dsp

# 0: Master Reset (Shaders, VSR, True HDR, Scalers, Pacing, Zoom, Pan & Audio DSP)
0          change-list glsl-shaders clr all ; vf remove @vsr ; vf remove @truehdr ; set af "" ; set scale "lanczos" ; set video-sync "display-resample" ; set interpolation "yes" ; set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 ; show-text "Reset: Default Scaling, Pacing & Geometry"

# ===== Subtitles & Audio Track Switching =====

v          cycle sub-visibility ; show-text "Subtitles: ${sub-visibility}"
j          cycle sub ; show-text "Subtitle Track: ${sub}"
J          cycle sub down ; show-text "Subtitle Track: ${sub}"
k          cycle audio ; show-text "Audio Track: ${audio}"
K          cycle audio down ; show-text "Audio Track: ${audio}"

# ===== Window, Statistics & Tools =====

f          cycle fullscreen
F11        cycle fullscreen
TAB        script-binding stats/display-stats-toggle
i          script-binding stats/display-stats
I          script-binding stats/display-stats-toggle
W          script-binding display-clip-maker
s          screenshot ; show-text "Screenshot Captured"
S          screenshot video ; show-text "Clean Video Screenshot Captured"