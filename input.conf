# =========================================================================
# MPV Keybindings Configuration
# =========================================================================

# ===== Scalers & Enhancements =====

# 1: NVIDIA RTX Video Super Resolution (Hardware AI Tensor Core)
1          change-list glsl-shaders clr all ; script-message autovsr-toggle

# 2: NVIDIA Image Scaling (NIS Spatial Upscaler)
2          change-list glsl-shaders set "~~/scalers/NVScaler.glsl" ; vf remove @vsr ; show-text "NVIDIA Image Scaling (NIS)"

# 3: AMD FidelityFX Super Resolution (FSR 1.0: EASU + RCAS)
3          change-list glsl-shaders set "~~/scalers/FSR.glsl" ; vf remove @vsr ; show-text "AMD FSR 1.0: EASU + RCAS"

# 4: Qualcomm Snapdragon Game Super Resolution (Single-Pass Edge Scaler)
4          change-list glsl-shaders set "~~/scalers/SGSR.glsl" ; vf remove @vsr ; show-text "Qualcomm SGSR"

# 5: AMD Contrast Adaptive Sharpening (Scaled Reconstruction)
5          change-list glsl-shaders set "~~/scalers/CAS-scaled.glsl" ; vf remove @vsr ; show-text "AMD CAS (Scaled)"

# Disabled Subsequent Number Keys
6          ignore
7          ignore
8          ignore

# NVIDIA RTX Video True HDR (SDR -> HDR auto-protection)
h          script-message autohdr-toggle

# Toggle Audio Player HUD on/off
a          script-message toggle-audio-hud

# Diagnostic & Reset Controls
9          cycle-values scale "nearest" "lanczos" ; show-text "Base Luma Scaler: ${scale}"
0          change-list glsl-shaders clr all ; vf remove @vsr ; vf remove @smoothmotion ; set scale "lanczos" ; show-text "Reset: Default Scaling"
-          show-text "Active Shaders: ${glsl-shaders}"

# ===== Window & Application Controls =====

q          quit
ESC        quit
F11        cycle fullscreen

# ===== Video Controls =====

d          cycle deband
r          cycle-values video-rotate 90 180 270 0
l          cycle-values loop-file inf no

WHEEL_UP   add video-zoom 0.08
WHEEL_DOWN add video-zoom -0.08
MBTN_RIGHT cycle pause
MBTN_MID   set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0
CTRL+RIGHT playlist-next
CTRL+LEFT  playlist-prev

# ===== Audio Controls =====

A          af toggle "surround:chl_out=7.1"