# =========================================================================
# MPV Main Configuration
# Optimized for Direct3D 11, RTX Upscaling & Neural Shaders
# =========================================================================

# ===== Main Video Output =====

vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-flip=yes                                # Modern DXGI Flip presentation model
d3d11-output-csp=auto                         # Automatic SDR/HDR swapchain color space detection
target-colorspace-hint=yes                    # Direct passthrough for Windows Advanced Color / HDR
hwdec=d3d11va                                 # Native zero-copy Direct3D 11 hardware decoding
hwdec-codecs=all

# ===== Frame Pacing & Display Synchronization (24fps on 60Hz - 240Hz) =====

video-sync=display-resample                   # Lock video presentation to display VBlank; resample audio ±0.1%
video-sync-max-factor=5                       # Frame pacing tolerance for high-refresh displays
interpolation=yes                             # Eliminate 3:2 pulldown judder
tscale=oversample                             # Crisp, zero-ghosting temporal transition (ideal for >=120Hz & 60Hz)
interpolation-preserve=no                     # Allow dropping frames under extreme GPU bottlenecks instead of crashing

# ===== Default Scalers & Chroma Quality =====

scale=lanczos                                 # High-quality fallback luma scaler
scale-clamp=yes                               # Ringing suppression for vo=gpu-next (libplacebo)
cscale=ewa_lanczos                            # Elite chroma scaler for sharp color reconstruction
cscale-clamp=yes                              # Chroma ringing suppression for vo=gpu-next (libplacebo)
dscale=mitchell                               # Smooth downscaler when rendering below native res
correct-downscaling=yes
sigmoid-upscaling=yes
linear-downscaling=yes                        # Downscale in linear light to preserve energy and prevent aliasing

# ===== Video Processing & Dithering =====

deinterlace=auto
deinterlace-field-parity=auto                 # <tff|bff|auto>
dither=error-diffusion                        # Compute-shader error-diffusion dithering (eliminates near-black banding)
error-diffusion=sierra-lite                   # Optimal quality-to-performance error diffusion kernel
dither-depth=auto                             # Dynamic dithering matched to display bit-depth
background-color='#000000'                    # Ensure pure black borders for OLED displays
background=color                              # Blend transparency over solid color instead of tiles

# ===== Debanding (Tuned Preset) =====

deband=no                                     # Off by default (toggled with 'd')
deband-iterations=4                           # Balanced deband passes
deband-threshold=48                           # Good threshold for banding removal without detail loss
deband-range=16                               # Optimal search radius
deband-grain=24                               # Subtle grain injection to mask residual quantization noise

# ===== Audio =====

volume-max=100
volume=100
audio-pitch-correction=yes                    # Maintain exact audio pitch during display-resample speed adjustments
audio-file-auto=fuzzy                         # Automatically load external audio tracks

# ===== Screenshots =====

screenshot-format=jpg                         # <jpg|png|webp|jxl|avif>
screenshot-webp-quality=85                    # <0-100>
screenshot-webp-compression=6                 # <0-6>
screenshot-tag-colorspace=no                  
screenshot-template="%{media-title}-%P-%n"
screenshot-dir=~~desktop/

# ===== RAM & Demuxer Cache =====

cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M
demuxer-readahead-secs=10

# ===== Subtitles =====

sub-auto=fuzzy                                # Automatically load external subtitle files
sub-blur=4
sub-color="#FFFFFFFF"                         
sub-outline-size=0.5                          
sub-outline-color="#FF000000"                 
sub-shadow-offset=0.5                        
sub-shadow-color="#FF000000"   

# ===== Player Window & System =====

priority=high                                 # Prioritize system resources for MPV
msg-level=all=-2
geometry=1600x1200
no-window-dragging
cursor-autohide=100
keep-open=yes
alang=ja,jp,jpn,en,eng
slang=ita,it,en,eng,ja,jp,jpn
autocreate-playlist=same                      # Automatically create playlist with sibling files of the same type
directory-mode=ignore                         # Prevent recursing into subdirectories

# ===== Image Viewer Controls =====

image-display-duration=inf                    # Keep still images displayed indefinitely (prevents black screen on cold start)

# ===== External Configurations =====

include="~~/configs/mpv_file_extensions.conf"